<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🎉 Trivia Night — Submit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F0F2A;color:#fff;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
h1{font-size:1.5rem;color:#FFD600;text-align:center;margin-bottom:4px}
.sub{color:#AAAACC;font-size:.85rem;margin-bottom:18px;text-align:center}
.card{background:#1A1A40;border-radius:14px;padding:16px;width:100%;max-width:460px;margin-bottom:12px}
label{display:block;color:#AAAACC;font-size:.72rem;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
input,textarea{width:100%;background:#0F0F2A;border:2px solid #333355;border-radius:9px;color:#fff;font-size:1rem;padding:10px 13px;outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:#FFD600}
textarea{resize:vertical;min-height:75px}
.btn{width:100%;padding:13px;border-radius:9px;border:none;background:#FFD600;color:#0F0F2A;font-size:1.05rem;font-weight:800;cursor:pointer;margin-top:10px;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.q-box{background:#0F0F2A;border:2px solid #29B6F6;border-radius:12px;padding:14px;margin-bottom:12px;width:100%;max-width:460px}
.q-label{color:#29B6F6;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.q-meta{color:#AAAACC;font-size:.78rem;margin-bottom:6px}
.q-text{font-size:1.05rem;line-height:1.5;font-weight:600;white-space:pre-line}
.feedback{display:none;padding:13px;border-radius:10px;margin-top:10px;font-weight:700;font-size:.95rem;text-align:center}
.correct{background:#1B4332;border:2px solid #66BB6A;color:#66BB6A}
.partial{background:#3B2800;border:2px solid #FFD600;color:#FFD600}
.wrong{background:#3B1A1A;border:2px solid #FF7043;color:#FF7043}
.badge{background:#29B6F6;color:#0F0F2A;border-radius:50px;padding:2px 12px;font-weight:800;font-size:.95rem;display:inline-block;margin-left:6px}
.score-strip{background:#1A1A40;border-radius:12px;padding:12px 16px;width:100%;max-width:460px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.score-strip .lbl{color:#AAAACC;font-size:.75rem}
.score-strip .val{color:#FFD600;font-size:1.5rem;font-weight:900}
a.lnk{color:#AAAACC;text-align:center;display:block;margin-top:8px;font-size:.88rem;text-decoration:none}
a.lnk:hover{color:#FFD600}
.already{color:#66BB6A;font-size:.82rem;margin-top:6px;display:none}
/* Gate */
#gate{position:fixed;inset:0;background:#0F0F2A;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:20px}
#gate h2{color:#FFD600;font-size:1.8rem;margin-bottom:8px}
#gate p{color:#AAAACC;margin-bottom:24px;text-align:center}
#gate input{width:100%;max-width:300px;background:#1A1A40;border:2px solid #333355;border-radius:9px;color:#fff;font-size:1rem;padding:11px 14px;outline:none;margin-bottom:12px}
#gate input:focus{border-color:#FFD600}
#gate button{width:100%;max-width:300px;padding:12px;border-radius:9px;border:none;background:#FFD600;color:#0F0F2A;font-size:1rem;font-weight:800;cursor:pointer}
#gate-err{color:#FF7043;min-height:1.4em;font-size:.88rem;text-align:center;margin-top:8px}
</style>
</head>
<body>

<div id="gate">
  <h2>🎉 Trivia Night</h2>
  <p>Enter tonight's password to join</p>
  <input type="password" id="gate-input" placeholder="Password" autocomplete="off">
  <button onclick="checkGate()">Enter →</button>
  <div id="gate-err"></div>
</div>

<h1>🎉 Family Trivia Night</h1>
<p class="sub">Submit your team's answers</p>

<div class="score-strip">
  <div><div class="lbl">Team</div><div style="font-weight:700;font-size:.95rem" id="teamDisplay">—</div></div>
  <div style="text-align:right"><div class="lbl">Score</div><div class="val" id="scoreDisplay">0</div></div>
</div>

<div class="card">
  <label>Your Team Name</label>
  <input type="text" id="teamName" placeholder="e.g. The Murphys" maxlength="30">
  <button class="btn" id="joinBtn" onclick="registerTeam()" style="margin-top:10px">Join Game →</button>
</div>

<div id="gameSection" style="display:none;width:100%;max-width:460px;display:none;flex-direction:column;align-items:center">

  <div class="q-box" id="qBox">
    <div class="q-label">Current Question</div>
    <div class="q-meta" id="qMeta">Loading…</div>
    <div class="q-text" id="qText">Connecting…</div>
  </div>

  <div class="card">
    <label>Your Answer</label>
    <textarea id="answerText" placeholder="Type your answer…" rows="3"></textarea>
    <div class="already" id="alreadyMsg">✅ Already answered this one!</div>
    <button class="btn" id="submitBtn" onclick="submitAnswer()">Submit Answer ✓</button>
    <div class="feedback" id="feedback"></div>
  </div>

  <a class="lnk" href="scores.html">📊 View Scoreboard →</a>
</div>

<script>
const API  = 'https://murphy-rog-zephyrus-g14-ga401qm-ga401qm.tail9c7ab.ts.net';
const PKEY = 'carlysbirthday';
let teamName = '';
let totalScore = 0;
let answeredKeys = {};
let currentKey = '';

// ── Gate ──────────────────────────────────────────────────────────────────
document.getElementById('gate-input').addEventListener('keydown', e => { if(e.key==='Enter') checkGate(); });
if (sessionStorage.getItem('ta') === '1') document.getElementById('gate').remove();

function checkGate() {
  const v = document.getElementById('gate-input').value.trim().toLowerCase();
  if (v === 'carlysbirthday') {
    sessionStorage.setItem('ta','1');
    document.getElementById('gate').remove();
    tryAutoLogin();
  } else {
    document.getElementById('gate-err').textContent = 'Wrong password — try again';
  }
}

function tryAutoLogin() {
  const saved = localStorage.getItem('trivia_team');
  if (saved) {
    document.getElementById('teamName').value = saved;
    registerTeam(true);
  }
}
if (sessionStorage.getItem('ta') === '1') tryAutoLogin();

// ── Register team ─────────────────────────────────────────────────────────
async function registerTeam(silent=false) {
  const name = document.getElementById('teamName').value.trim();
  if (!name) { alert('Enter your team name!'); return; }

  const btn = document.getElementById('joinBtn');
  btn.disabled = true;
  btn.textContent = 'Joining…';

  try {
    const res = await fetch(`${API}/api/register`, {
      method:'POST', headers:{'Content-Type':'application/json','x-api-key':PKEY},
      body: JSON.stringify({ team: name })
    });
    const data = await res.json();
    teamName = data.name;
    totalScore = data.score;
    answeredKeys = {};
    (data.answeredQuestions||[]).forEach(k => answeredKeys[k] = true);

    localStorage.setItem('trivia_team', teamName);
    document.getElementById('teamDisplay').textContent = teamName;
    document.getElementById('scoreDisplay').textContent = totalScore;
    document.getElementById('gameSection').style.display = 'flex';

    loadQuestion();
  } catch(e) {
    if (!silent) alert('Could not connect to game server — check your connection');
    btn.disabled = false;
    btn.textContent = 'Join Game →';
  }
}

// ── Load current question ─────────────────────────────────────────────────
async function loadQuestion() {
  try {
    const res = await fetch(`${API}/api/current`, { headers:{'x-api-key':PKEY} });
    const data = await res.json();
    currentKey = `${data.round}-${data.questionNum-1}`;
    document.getElementById('qMeta').textContent = `Round ${data.round} · Q${data.questionNum} of ${data.totalQuestions}`;
    document.getElementById('qText').textContent = data.question || 'Waiting for next question…';

    const already = answeredKeys[currentKey];
    document.getElementById('alreadyMsg').style.display = already ? 'block' : 'none';
    document.getElementById('submitBtn').style.display  = already ? 'none'  : 'block';
    document.getElementById('answerText').style.display = already ? 'none'  : 'block';
    document.getElementById('feedback').style.display = 'none';
  } catch(e) {}
}
setInterval(loadQuestion, 4000);

// ── Submit ─────────────────────────────────────────────────────────────────
async function submitAnswer() {
  const answer = document.getElementById('answerText').value.trim();
  if (!answer) { alert('Type an answer first!'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Scoring…';

  try {
    const res = await fetch(`${API}/api/answer`, {
      method:'POST', headers:{'Content-Type':'application/json','x-api-key':PKEY},
      body: JSON.stringify({ team:teamName, answer })
    });
    const data = await res.json();

    if (data.alreadyAnswered) {
      answeredKeys[currentKey] = true;
      loadQuestion();
      btn.disabled = false;
      btn.textContent = 'Submit Answer ✓';
      return;
    }

    totalScore = data.totalScore;
    answeredKeys[currentKey] = true;
    document.getElementById('scoreDisplay').textContent = totalScore;

    const fb = document.getElementById('feedback');
    fb.style.display = 'block';
    const pts = data.points;
    fb.className = 'feedback ' + (pts>=8?'correct':pts>=4?'partial':'wrong');
    fb.innerHTML = (pts>=8?'✅ Correct!':pts>=4?'🤔 Partial credit!':'❌ Not quite.')
      + `<span class="badge">+${pts} pts</span><br><small>${data.feedback}</small>`;

    document.getElementById('answerText').value = '';
    document.getElementById('answerText').style.display = 'none';
    document.getElementById('alreadyMsg').style.display = 'block';
    btn.style.display = 'none';
  } catch(e) {
    alert('Submission failed — try again');
  }
  btn.disabled = false;
  btn.textContent = 'Submit Answer ✓';
}
</script>
</body>
</html>
