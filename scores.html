<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📊 Live Scoreboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F0F2A;color:#fff;font-family:'Segoe UI',Arial,sans-serif;padding:0}
.top{background:#1A1A40;padding:20px 24px 16px;text-align:center;border-bottom:2px solid #333355}
h1{color:#FFD600;font-size:2.2rem;margin-bottom:4px}
.q-now{background:#0F0F2A;border:2px solid #29B6F6;border-radius:12px;padding:14px 18px;margin:16px auto;max-width:700px}
.q-now .lbl{color:#29B6F6;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.q-now .meta{color:#AAAACC;font-size:.82rem;margin-bottom:4px}
.q-now .text{font-size:1.1rem;font-weight:700;line-height:1.45}
.board{max-width:700px;margin:0 auto;padding:0 16px 24px}
.team{background:#1A1A40;border-radius:14px;padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
.team.first{border:2px solid #FFD600}
.team.second{border:2px solid #AAAACC}
.team.third{border:2px solid #FF7043}
.rank{font-size:2rem;width:44px;text-align:center}
.info{flex:1}
.name{font-size:1.1rem;font-weight:800}
.det{color:#AAAACC;font-size:.78rem;margin-top:3px}
.sc{font-size:2.2rem;font-weight:900;color:#FFD600}
.empty{text-align:center;color:#AAAACC;padding:60px 20px}
a.lnk{color:#AAAACC;text-align:center;display:block;padding:12px;font-size:.88rem;text-decoration:none}
a.lnk:hover{color:#FFD600}
/* Gate */
#gate{position:fixed;inset:0;background:#0F0F2A;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:20px}
#gate h2{color:#FFD600;font-size:1.8rem;margin-bottom:8px}
#gate p{color:#AAAACC;margin-bottom:24px;text-align:center}
#gate input{width:100%;max-width:300px;background:#1A1A40;border:2px solid #333355;border-radius:9px;color:#fff;font-size:1rem;padding:11px 14px;outline:none;margin-bottom:12px}
#gate input:focus{border-color:#FFD600}
#gate button{width:100%;max-width:300px;padding:12px;border-radius:9px;border:none;background:#FFD600;color:#0F0F2A;font-size:1rem;font-weight:800;cursor:pointer}
#gate-err{color:#FF7043;min-height:1.4em;font-size:.88rem;text-align:center;margin-top:8px}
.sub{color:#AAAACC;font-size:.82rem}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body>

<div id="gate">
  <h2>📊 Scoreboard</h2>
  <p>Enter the password to view</p>
  <input type="password" id="gate-input" placeholder="Password" autocomplete="off">
  <button onclick="checkGate()">Enter →</button>
  <div id="gate-err"></div>
</div>

<div class="top">
  <h1>📊 Live Scoreboard</h1>
  <div class="sub pulse" id="liveTag">● Live</div>
</div>

<div class="q-now" id="qNow">
  <div class="lbl">Current Question on Screen</div>
  <div class="meta" id="qMeta">Loading…</div>
  <div class="text" id="qText">—</div>
</div>

<div class="board" id="board">
  <div class="empty">Waiting for teams…</div>
</div>

<a class="lnk" href="play.html">← Back to Submit Answers</a>

<script>
const API  = 'https://murphy-rog-zephyrus-g14-ga401qm-ga401qm.tail9c7ab.ts.net';
const PKEY = 'carlysbirthday';
const medals = ['🥇','🥈','🥉'];
const borders = ['first','second','third'];

document.getElementById('gate-input').addEventListener('keydown', e => { if(e.key==='Enter') checkGate(); });
if (sessionStorage.getItem('ta') === '1') { document.getElementById('gate').remove(); start(); }

function checkGate() {
  const v = document.getElementById('gate-input').value.trim().toLowerCase();
  if (v === 'carlysbirthday' || v === 'hilary21') {
    sessionStorage.setItem('ta','1');
    document.getElementById('gate').remove();
    start();
  } else {
    document.getElementById('gate-err').textContent = 'Wrong password';
  }
}

function start() { refresh(); setInterval(refresh, 5000); }

async function refresh() {
  try {
    const [qRes, sRes] = await Promise.all([
      fetch(`${API}/api/current`, { headers:{'x-api-key':PKEY} }),
      fetch(`${API}/api/scores`,  { headers:{'x-api-key':PKEY} })
    ]);
    const q = await qRes.json();
    const teams = await sRes.json();

    document.getElementById('qMeta').textContent = `Round ${q.round} — ${q.roundTitle} · Q${q.questionNum} of ${q.totalQuestions}`;
    document.getElementById('qText').textContent = q.question || 'Waiting…';

    const board = document.getElementById('board');
    if (!teams.length) {
      board.innerHTML = '<div class="empty">No teams yet!</div>';
      return;
    }
    board.innerHTML = teams.map((t,i) => `
      <div class="team ${borders[i]||''}">
        <div class="rank">${medals[i]||(i+1)+'.'}</div>
        <div class="info">
          <div class="name">${t.name}</div>
          <div class="det">${t.answers} answer${t.answers!==1?'s':''} submitted</div>
        </div>
        <div class="sc">${t.score}</div>
      </div>`).join('');
  } catch(e) {
    document.getElementById('liveTag').textContent = '⚠ Connection issue — retrying';
  }
}
</script>
</body>
</html>
